<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kotoha - Safari対応版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Meiryo", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: white;
            margin-bottom: 10px;
            font-size: 2em;
        }
        .subtitle {
            text-align: center;
            color: rgba(255,255,255,0.8);
            margin-bottom: 20px;
            font-size: 0.9em;
        }
        .status-box {
            background: rgba(255,255,255,0.95);
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 15px;
        }
        .status-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ffc107;
            flex-shrink: 0;
        }
        .status-dot.ready {
            background: #28a745;
        }
        .status-dot.error {
            background: #dc3545;
        }
        .status-dot.loading {
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .backend-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.75em;
            margin-left: 10px;
            font-weight: bold;
        }
        .backend-badge.webgpu {
            background: #d4edda;
            color: #155724;
        }
        .backend-badge.wasm {
            background: #fff3cd;
            color: #856404;
        }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: #667eea;
            border-radius: 3px;
            transition: width 0.3s;
            width: 0%;
        }
        .chat-container {
            background: rgba(255,255,255,0.95);
            border-radius: 12px;
            height: 450px;
            overflow-y: auto;
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.6;
            font-size: 0.95em;
            word-wrap: break-word;
        }
        .message.user {
            align-self: flex-end;
            background: #667eea;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .message.bot {
            align-self: flex-start;
            background: #f1f3f4;
            color: #333;
            border-bottom-left-radius: 4px;
        }
        .message.system {
            align-self: center;
            background: #fff3cd;
            color: #856404;
            font-size: 0.85em;
            max-width: 90%;
        }
        .quick-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }
        .quick-btn {
            padding: 8px 14px;
            background: rgba(255,255,255,0.9);
            border: none;
            border-radius: 20px;
            font-size: 0.85em;
            cursor: pointer;
            transition: all 0.2s;
            color: #333;
        }
        .quick-btn:hover:not(:disabled) {
            background: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        }
        .quick-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .input-area {
            background: rgba(255,255,255,0.95);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            gap: 10px;
        }
        .input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            outline: none;
        }
        .input-area input:focus {
            border-color: #667eea;
        }
        .input-area button {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
        }
        .input-area button:hover:not(:disabled) {
            background: #5a6fd6;
        }
        .input-area button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .speed-warning {
            background: #e7f3ff;
            border-left: 4px solid #667eea;
            padding: 10px 15px;
            margin-bottom: 15px;
            border-radius: 0 8px 8px 0;
            font-size: 0.85em;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌸 kotoha</h1>
        <p class="subtitle">Safari対応・ブラウザ内で動く勉強AI</p>

        <div class="status-box">
            <div class="status-row">
                <div class="status-dot loading" id="statusDot"></div>
                <div>
                    <span id="statusText">モデルを準備中...</span>
                    <span class="backend-badge" id="backendBadge" style="display:none;"></span>
                </div>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressBar"></div>
            </div>
        </div>

        <div class="speed-warning" id="speedWarning" style="display:none;">
            💡 SafariではCPU（WASM）モードで動作します。回答が少し遅くなる（10〜30秒）ことがありますが、気長にお待ちください。
        </div>

        <div class="quick-buttons">
            <button class="quick-btn" onclick="sendQuick(&#39;こんにちは！今日の勉強頑張るよ&#39;)" disabled id="btn1">👋 挨拶</button>
            <button class="quick-btn" onclick="sendQuick(&#39;数学を25分やりたい。疲れてる。アドバイスして&#39;)" disabled id="btn2">📐 数学</button>
            <button class="quick-btn" onclick="sendQuick(&#39;英語を25分やりたい。元気だよ。アドバイスして&#39;)" disabled id="btn3">🔤 英語</button>
            <button class="quick-btn" onclick="sendQuick(&#39;ポモドーロ2個目終わった。次どうする？&#39;)" disabled id="btn4">🍅 ポモドーロ</button>
            <button class="quick-btn" onclick="sendQuick(&#39;やる気が出ない…&#39;)" disabled id="btn5">😮‍💨 やる気なし</button>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="message system">👋 kotohaへようこそ！初回のみAIモデルをダウンロードしています。SafariではCPUモードで動作するため、初回ダウンロードとモデル準備に1〜2分かかることがあります。</div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="メッセージを入力..." disabled>
            <button id="sendBtn" onclick="sendMessage()" disabled>送信</button>
        </div>
    </div>

    <script type="module">
        import { pipeline } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.5.0";

        const chatContainer = document.getElementById("chatContainer");
        const userInput = document.getElementById("userInput");
        const sendBtn = document.getElementById("sendBtn");
        const statusText = document.getElementById("statusText");
        const statusDot = document.getElementById("statusDot");
        const progressBar = document.getElementById("progressBar");
        const backendBadge = document.getElementById("backendBadge");
        const speedWarning = document.getElementById("speedWarning");

        let generator = null;
        let isGenerating = false;

        const SYSTEM_PROMPT = `あなたは「kotoha（ことは）」という前の中学1年の勉強相棒AIです。
性格：元気で親しみやすい。時々厳しいことを言うが、基本は応援する。
話し方：「だよ」「〜ね」「がんばれ！」など、同い年の友達のような口調。敬語は使わない。
回答ルール：
- 必ず3行以内で答える
- 具体的なアドバイスを出す
- 疲れている相手には無理しない方法を提案する`;

        async function initModel() {
            try {
                statusText.textContent = "モデルをダウンロード中...（初回のみ・約400MB）";

                // WebGPU対応チェック
                const hasWebGPU = !!navigator.gpu;
                if (!hasWebGPU) {
                    speedWarning.style.display = "block";
                    backendBadge.textContent = "WASM (CPU)";
                    backendBadge.className = "backend-badge wasm";
                } else {
                    backendBadge.textContent = "WebGPU";
                    backendBadge.className = "backend-badge webgpu";
                }
                backendBadge.style.display = "inline-block";

                generator = await pipeline(
                    "text-generation",
                    "onnx-community/Qwen2.5-0.5B-Instruct",
                    {
                        dtype: "q4",  // 4bit量化で軽くする
                        device: hasWebGPU ? "webgpu" : "wasm",
                        progress_callback: (report) => {
                            if (report.status === "progress") {
                                const percent = Math.round(report.loaded / report.total * 100);
                                progressBar.style.width = percent + "%";
                                statusText.textContent = `モデルを準備中... ${report.file} (${percent}%)`;
                            }
                        }
                    }
                );

                statusText.textContent = "準備完了！お話しできます";
                statusDot.className = "status-dot ready";
                progressBar.style.width = "100%";

                userInput.disabled = false;
                sendBtn.disabled = false;
                document.querySelectorAll(".quick-btn").forEach(btn => btn.disabled = false);
                userInput.focus();

                addMessage("✅ 準備完了！kotohaだよ。今日は何やる？", "bot");

            } catch (err) {
                console.error(err);
                statusText.textContent = "エラーが発生しました";
                statusDot.className = "status-dot error";
                addMessage("❌ エラー: " + err.message, "system");
            }
        }

        function addMessage(text, sender) {
            const div = document.createElement("div");
            div.className = `message ${sender}`;
            div.textContent = text;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text || isGenerating) return;

            addMessage(text, "user");
            userInput.value = "";
            isGenerating = true;
            sendBtn.disabled = true;
            sendBtn.textContent = "生成中...";
            document.querySelectorAll(".quick-btn").forEach(btn => btn.disabled = true);

            try {
                const messages = [
                    { role: "system", content: SYSTEM_PROMPT },
                    { role: "user", content: text }
                ];

                const output = await generator(messages, {
                    max_new_tokens: 200,
                    temperature: 0.7,
                    do_sample: true,
                    top_p: 0.9
                });

                const reply = output[0].generated_text.at(-1).content;
                addMessage(reply, "bot");

            } catch (err) {
                console.error(err);
                addMessage("エラー: " + err.message, "system");
            }

            isGenerating = false;
            sendBtn.disabled = false;
            sendBtn.textContent = "送信";
            document.querySelectorAll(".quick-btn").forEach(btn => btn.disabled = false);
            userInput.focus();
        }

        window.sendQuick = function(text) {
            userInput.value = text;
            sendMessage();
        };

        userInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") sendMessage();
        });

        initModel();
    </script>
</body>
</html>
